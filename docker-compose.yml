services:
  postgres:
    image: postgres:17-alpine
    container_name: lablanca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lablanca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lablanca-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lablanca"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lablanca-pgdata:
